# JefNet : toute l'application en conteneurs.
# Lancement : copier .env.docker.example en .env (à la racine), le remplir, puis
#   docker compose up -d --build
# Le site est ensuite sur http://localhost (ou http://IP-du-PC depuis un autre PC du même Wi-Fi).
name: jefnet

# réglages communs aux 4 conteneurs Laravel (même image, rôle différent).
# Seul « api » construit l'image ; les 3 autres réutilisent la même (pull_policy: never)
x-laravel: &laravel
  image: jefnet-api
  pull_policy: never
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage/app

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API Laravel (PHP-FPM) : lance les migrations au démarrage
  api:
    <<: *laravel
    build:
      context: ./backend
      target: app
    pull_policy: build
    environment:
      ROLE: app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/jefnet-pret"]
      interval: 5s
      timeout: 3s
      retries: 60

  # serveur temps réel (messagerie, notifications)
  reverb:
    <<: *laravel
    environment:
      ROLE: reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      api:
        condition: service_healthy

  # tâches en arrière-plan (e-mails OTP)
  queue:
    <<: *laravel
    environment:
      ROLE: queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      api:
        condition: service_healthy

  # tâches planifiées (expiration des demandes chaque nuit)
  scheduler:
    <<: *laravel
    environment:
      ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy

  # point d'entrée unique : site React compilé + redirections vers l'API et Reverb
  web:
    build:
      context: ./frontend
      target: web
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
    image: jefnet-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - storage:/var/www/storage:ro
    depends_on:
      api:
        condition: service_healthy
      reverb:
        condition: service_started

volumes:
  pgdata:
  storage: