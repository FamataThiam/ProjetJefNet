# nginx de JefNet : site React + redirections vers Laravel (api) et Reverb
server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # API Laravel (PHP-FPM dans le conteneur « api »)
    location ~ ^/(api|up)(/|$) {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 120s;
    }

    # temps réel : WebSocket Reverb
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # fichiers publics (photos, médias des publications) : volume partagé avec Laravel
    location /storage/ {
        alias /var/www/storage/public/;
        expires 7d;
        access_log off;
    }

    # fichiers du site compilé : mis en cache longtemps (leur nom change à chaque build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # toutes les autres adresses : application React (react-router)
    location / {
        try_files $uri /index.html;
    }
}